name: Build RostLang WebView Launchers
on:
  workflow_dispatch:
  push:
    branches: [launcher-webview]
    paths:
      - "launcher-web/**"
      - "launcher-windows/**"
      - "android-web/**"
      - ".github/workflows/build-webview-launchers.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Publish single-file EXE
        run: dotnet publish launcher-windows/RostLangLauncher.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: RostLangLauncher-Windows-WebView
          path: publish/RostLangLauncher.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Copy shared launcher assets
        run: |
          mkdir -p android-web/app/src/main/assets/launcher
          cp -R launcher-web/. android-web/app/src/main/assets/launcher/
      - name: Build debug APK
        working-directory: android-web
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RostLangLauncher-Android-WebView
          path: android-web/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
