name: Build RostLang Launcher (Android)

on:
  workflow_dispatch:
  push:
    paths:
      - "android_app/**"
      - "rostlang/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Include RostLang interpreter package
        run: cp -r rostlang android_app/rostlang

      - name: Build debug APK
        working-directory: android_app
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RostLangLauncher-Android
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
