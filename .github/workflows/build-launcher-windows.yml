name: Build RostLang Launcher (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - "rostlang/**"
      - "main.py"
      - ".github/workflows/build-launcher-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r launcher/requirements-build.txt

      - name: Build standalone RostLang runtime
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name rost_runtime main.py

      - name: Build graphical launcher
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RostLangLauncher --add-binary "dist/rost_runtime.exe;." launcher/main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RostLangLauncher-Windows
          path: dist/RostLangLauncher.exe
          if-no-files-found: error
          retention-days: 30
